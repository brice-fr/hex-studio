name: Release

on:
  push:
    tags:
      - 'v*'
  # A manual run has to be told which tag it is building. Without that the
  # steps below fall back to github.ref_name, which on a manual run is the
  # branch — producing a release called "Hex Studio main".
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build (e.g. v0.3.2)'
        required: true

permissions:
  contents: write

jobs:
  # Both macOS slices come off one Apple Silicon runner: aarch64 builds
  # natively and x86_64 cross-compiles, which needs no Intel runner and keeps
  # the two artefacts in step. The Rust cache is what makes the second build
  # cheap — it recompiles only what differs by target.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Apple Silicon. This runs first and creates the draft release; the
      # invocations after it find that draft and only add their artefacts.
      - name: Build (Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: 'Hex Studio ${{ inputs.tag_name || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

      # Intel, for Macs that predate Apple Silicon and for anyone running an
      # Intel build of a host application.
      - name: Build (Intel)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: 'Hex Studio ${{ inputs.tag_name || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-apple-darwin

      # tauri-action notarises and staples the .app and then wraps it in a dmg — but nothing ever
      # submits the dmg itself, so the disk image ships signed-but-unnotarised. Measured on
      # v0.3.3: the app inside came back "accepted / source=Notarized Developer ID", while the
      # dmg around it was rejected as "Unnotarized Developer ID".
      #
      # scripts/release.sh avoids this locally by building the dmg itself as a second phase. Here
      # the dmg already exists and has already been uploaded, so this notarises it, staples it, and
      # replaces the uploaded asset. The spctl check is the point of the step, not decoration: it is
      # the exact assertion that failed on v0.3.3, so a regression fails the build rather than
      # shipping.
      - name: Notarise and staple the disk images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The Rust root is src-tauri/, so bundles land under src-tauri/target/, not target/.
          dmgs=(src-tauri/target/*/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No dmg under src-tauri/target/*/release/bundle/dmg/ — did the bundle step change?" >&2
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            echo "::group::$(basename "$dmg")"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            # spctl is the gate: it is what actually catches the unnotarised-dmg bug and it behaves
            # correctly on GitHub runners.
            spctl -a -vvv -t install "$dmg"
            # Upload the stapled dmg before syspolicy_check so the release always holds the correct
            # artefact even if the check below fails.
            gh release upload "$TAG" "$dmg" --clobber --repo "$GITHUB_REPOSITORY"
            # syspolicy_check is informational only in CI: on GitHub runners it reports
            # "Internal Xprotect Error / Severity: Fatal" on perfectly good artefacts (verified
            # against a real Mac). Running it fails good releases without catching real problems,
            # so failures become warnings here. The gate is spctl above.
            syspolicy_check distribution "$dmg" \
              || echo "::warning::syspolicy_check failed for $(basename "$dmg") — this is expected on GitHub runners and does not indicate a problem with the artefact"
            echo "::endgroup::"
          done

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: 'Hex Studio ${{ inputs.tag_name || github.ref_name }}'
          releaseDraft: true
          prerelease: false
