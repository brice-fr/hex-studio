name: Release

on:
  push:
    tags:
      - 'v*'
  # A manual run has to be told which tag it is building. Without that the
  # steps below fall back to github.ref_name, which on a manual run is the
  # branch — producing a release called "Hex Studio main".
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build (e.g. v0.3.2)'
        required: true

permissions:
  contents: write

jobs:
  # Both macOS slices come off one Apple Silicon runner: aarch64 builds
  # natively and x86_64 cross-compiles, which needs no Intel runner and keeps
  # the two artefacts in step. The Rust cache is what makes the second build
  # cheap — it recompiles only what differs by target.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Apple Silicon. This runs first and creates the draft release; the
      # invocations after it find that draft and only add their artefacts.
      - name: Build (Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: 'Hex Studio ${{ inputs.tag_name || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

      # Intel, for Macs that predate Apple Silicon and for anyone running an
      # Intel build of a host application.
      - name: Build (Intel)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: 'Hex Studio ${{ inputs.tag_name || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-apple-darwin

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: 'Hex Studio ${{ inputs.tag_name || github.ref_name }}'
          releaseDraft: true
          prerelease: false
