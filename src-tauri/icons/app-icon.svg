<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#07101f"/>
      <stop offset="100%" stop-color="#0b1c32"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#00343f"/>
      <stop offset="100%" stop-color="#005a62"/>
    </linearGradient>
    <filter id="glow" x="-12%" y="-30%" width="124%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleglow" x="-6%" y="-40%" width="112%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="1024" height="1024" rx="225"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="225" fill="url(#bg)"/>

  <g clip-path="url(#clip)">

    <!-- title bar -->
    <rect x="0" y="0" width="1024" height="110" fill="#050b17"/>
    <rect x="0" y="0" width="7"    height="110" fill="#20d0c2"/>
    <text x="528" y="76"
          font-family="Courier New, Courier, monospace"
          font-size="52" font-weight="bold" letter-spacing="11"
          text-anchor="middle" fill="#20d0c2" filter="url(#titleglow)">HEX STUDIO</text>
    <line x1="0" y1="110" x2="1024" y2="110" stroke="#122535" stroke-width="2.5"/>

    <!-- column header row -->
    <rect x="0" y="110" width="1024" height="70" fill="#09131e"/>
    <text x="50"  y="157" font-family="Courier New, Courier, monospace" font-size="32" fill="#173348">Address</text>
    <text x="380" y="157" font-family="Courier New, Courier, monospace" font-size="32" fill="#173348">+0   +1   +2   +3</text>
    <text x="778" y="157" font-family="Courier New, Courier, monospace" font-size="32" fill="#173348">Text</text>
    <line x1="0" y1="180" x2="1024" y2="180" stroke="#122535" stroke-width="2"/>

    <!-- column separators -->
    <line x1="360" y1="110" x2="360" y2="1024" stroke="#122535" stroke-width="2"/>
    <line x1="756" y1="110" x2="756" y2="1024" stroke="#122535" stroke-width="2"/>

    <!-- row 1 -->
    <text x="50"  y="245" font-family="Courier New, Courier, monospace" font-size="44" fill="#163856">00000FF0</text>
    <text x="380" y="245" font-family="Courier New, Courier, monospace" font-size="44" fill="#1f5270">5C A1 3F B2</text>
    <text x="770" y="245" font-family="Courier New, Courier, monospace" font-size="44" fill="#163242">\.?.</text>

    <!-- row 2 -->
    <rect x="0" y="272" width="1024" height="92" fill="rgba(0,0,0,0.14)"/>
    <text x="50"  y="337" font-family="Courier New, Courier, monospace" font-size="44" fill="#163856">00000FF4</text>
    <text x="380" y="337" font-family="Courier New, Courier, monospace" font-size="44" fill="#1f5270">D4 0A F3 7E</text>
    <text x="770" y="337" font-family="Courier New, Courier, monospace" font-size="44" fill="#163242">...~</text>

    <!-- row 3 — HIGHLIGHTED -->
    <rect x="0" y="364" width="1024" height="92" fill="url(#hl)"/>
    <rect x="0" y="364" width="7"    height="92" fill="#20d0c2"/>
    <rect x="0" y="364" width="1024" height="92" fill="#20d0c2" opacity="0.05"/>
    <text x="50"  y="429" font-family="Courier New, Courier, monospace" font-size="44" fill="#74d8d0" filter="url(#glow)">00001000</text>
    <text x="380" y="429" font-family="Courier New, Courier, monospace" font-size="44" fill="#ffffff"  filter="url(#glow)">48 45 58 53</text>
    <text x="770" y="429" font-family="Courier New, Courier, monospace" font-size="44" fill="#20d0c2" filter="url(#glow)">HEXS</text>

    <!-- row 4 -->
    <text x="50"  y="521" font-family="Courier New, Courier, monospace" font-size="44" fill="#163856">00001004</text>
    <text x="380" y="521" font-family="Courier New, Courier, monospace" font-size="44" fill="#1f5270">C3 0F 6D 82</text>
    <text x="770" y="521" font-family="Courier New, Courier, monospace" font-size="44" fill="#163242">..m.</text>

    <!-- row 5 -->
    <rect x="0" y="548" width="1024" height="92" fill="rgba(0,0,0,0.14)"/>
    <text x="50"  y="613" font-family="Courier New, Courier, monospace" font-size="44" fill="#163856">00001008</text>
    <text x="380" y="613" font-family="Courier New, Courier, monospace" font-size="44" fill="#1f5270">F9 2B 4A 17</text>
    <text x="770" y="613" font-family="Courier New, Courier, monospace" font-size="44" fill="#163242">.+J.</text>

    <!-- row 6 -->
    <text x="50"  y="705" font-family="Courier New, Courier, monospace" font-size="44" fill="#163856">0000100C</text>
    <text x="380" y="705" font-family="Courier New, Courier, monospace" font-size="44" fill="#1f5270">8E D2 36 5A</text>
    <text x="770" y="705" font-family="Courier New, Courier, monospace" font-size="44" fill="#163242">..6Z</text>

    <!-- row 7 -->
    <rect x="0" y="732" width="1024" height="92" fill="rgba(0,0,0,0.14)"/>
    <text x="50"  y="797" font-family="Courier New, Courier, monospace" font-size="44" fill="#163856">00001010</text>
    <text x="380" y="797" font-family="Courier New, Courier, monospace" font-size="44" fill="#1f5270">1B 6C 92 E8</text>
    <text x="770" y="797" font-family="Courier New, Courier, monospace" font-size="44" fill="#163242">.l..</text>

    <!-- row 8 -->
    <text x="50"  y="889" font-family="Courier New, Courier, monospace" font-size="44" fill="#163856">00001014</text>
    <text x="380" y="889" font-family="Courier New, Courier, monospace" font-size="44" fill="#1f5270">7A 3C B5 0D</text>
    <text x="770" y="889" font-family="Courier New, Courier, monospace" font-size="44" fill="#163242">z&lt;..</text>

    <!-- status bar -->
    <rect x="0" y="916" width="1024" height="108" fill="#050b17"/>
    <rect x="0" y="916" width="7"    height="108" fill="#20d0c2" opacity="0.7"/>
    <line x1="0" y1="916" x2="1024" y2="916" stroke="#122535" stroke-width="2"/>
    <text x="50" y="984"
          font-family="Courier New, Courier, monospace"
          font-size="34" fill="#20d0c2">▶  00001000  ·  HEXS  ·  4 bytes</text>

  </g>
</svg>
